# KnowledgeOps Console：PostgreSQL/Redis/API/Worker/前端；复用已存在的 Qdrant/Ollama。
# 默认经 Windows Docker Desktop 的 host.docker.internal 访问现有 Qdrant/Ollama 映射端口。
# 如果现有容器没有发布端口，请改为共享 Docker 网络并使用容器名。
name: knowledgeops-console

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agent -d agent_db']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: [.env]
    environment:
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      # AutoTokenizer 只认 HF 的缓存变量，权重实际在 sentence-transformers 目录下
      HF_HUB_CACHE: /models/sentence-transformers
      # 现有 qdrant 只把端口发布到宿主 127.0.0.1，容器走
      # host.docker.internal 是到不了宿主回环的，
      # 所以把它挂进本 compose 网络后用容器名访问。
      QDRANT_URL: http://qdrant:6333
      RAG_RETRIEVAL_URL: http://rag-api:8010
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${API_PORT:-8000}:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rag-api: {condition: service_started}
    volumes: ['./uploads:/app/uploads', './data:/app/data', './logs:/app/logs', './evaluation/results:/app/evaluation/results', 'hf_models:/models']
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
  agent-worker:
    build:
      context: .
      target: agent
    restart: unless-stopped
    env_file: [.env]
    environment:
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      # AutoTokenizer 只认 HF 的缓存变量，权重实际在 sentence-transformers 目录下
      HF_HUB_CACHE: /models/sentence-transformers
      # 现有 qdrant 只把端口发布到宿主 127.0.0.1，容器走
      # host.docker.internal 是到不了宿主回环的，
      # 所以把它挂进本 compose 网络后用容器名访问。
      QDRANT_URL: http://qdrant:6333
      RAG_RETRIEVAL_URL: http://rag-api:8010
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rag-api: {condition: service_started}
    volumes: ['./uploads:/app/uploads', './data:/app/data', './logs:/app/logs', 'hf_models:/models']
    command: [python, -m, agent.worker]
  rag-api:
    build:
      context: .
      target: full
    restart: unless-stopped
    env_file: [.env]
    environment:
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      HF_HUB_CACHE: /models/sentence-transformers
      QDRANT_URL: http://qdrant:6333
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ['./uploads:/app/uploads', './data:/app/data', './logs:/app/logs', 'hf_models:/models']
    command: [uvicorn, rag.service:app, --host, 0.0.0.0, --port, '8010']
  rag-worker:
    build:
      context: .
      target: full
    restart: unless-stopped
    env_file: [.env]
    environment:
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      # AutoTokenizer 只认 HF 的缓存变量，权重实际在 sentence-transformers 目录下
      HF_HUB_CACHE: /models/sentence-transformers
      # 现有 qdrant 只把端口发布到宿主 127.0.0.1，容器走
      # host.docker.internal 是到不了宿主回环的，
      # 所以把它挂进本 compose 网络后用容器名访问。
      QDRANT_URL: http://qdrant:6333
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ['./uploads:/app/uploads', './data:/app/data', './logs:/app/logs', 'hf_models:/models']
    command: [python, -m, rag.worker]
  cleanup-worker:
    build:
      context: .
      target: lite
    restart: unless-stopped
    env_file: [.env]
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ['./uploads:/app/uploads', './data:/app/data', './logs:/app/logs']
    command: [python, -m, rag.cleanup_worker]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ['${FRONTEND_PORT:-8080}:80']
  # 评测跑在容器网络里，指向 api 服务名而不是 localhost。
  # 用法：docker compose --profile eval run --rm rag-eval
  rag-eval:
    build:
      context: .
      target: lite
    profiles: [eval]
    env_file: [.env]
    # 报告落宿主 evaluation/results/，与 README 的输出目录一致。
    volumes: ['./evaluation/results:/app/evaluation/results']
    depends_on:
      api: {condition: service_started}
    command:
      - python
      - evaluation/rag_eval_runner.py
      - --base-url
      - http://api:8000
      - --cases
      - evaluation/rag_eval_cases_v3.json
      - --retrieval-mode
      - hybrid
      - --timeout
      - "180"
      - --fail-under
      - "0.8"
volumes:
  postgres_data:
    name: project_postgres_data
  redis_data:
    name: project_redis_data
  hf_models:
    name: project_hf_models
